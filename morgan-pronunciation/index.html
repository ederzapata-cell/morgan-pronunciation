<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Morgan Speaking</title>

  <link rel="manifest" href="app.webmanifest">
  <meta name="theme-color" content="#0096E1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Morgan">
  <link rel="icon" type="image/png" href="morgan-app-icon.png">

  <style>
    :root {
      --blue-main: #0096E1;
      --blue-deep: #0B3A64;
      --blue-soft: #7FA1E6;
      --blue-light: #C9D5EE;
      --card-bg: rgba(255, 255, 255, 0.94);
      --bubble-bg: #f4f8fd;
      --text-dark: #18324a;
      --text-soft: #4f6580;
      --text-muted: #7a8ea7;
      --success: #23b26d;
      --danger: #d9534f;
      --shadow-lg: 0 22px 48px rgba(7, 36, 74, 0.16);
      --shadow-md: 0 10px 24px rgba(7, 36, 74, 0.10);
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.35), transparent 30%),
        radial-gradient(circle at bottom right, rgba(255,255,255,0.18), transparent 28%),
        linear-gradient(180deg, var(--blue-soft), var(--blue-light));
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: var(--card-bg);
      border-radius: var(--radius-xl);
      padding: 20px 18px 16px;
      box-shadow: var(--shadow-lg);
      text-align: center;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 155px;
      background: linear-gradient(180deg, rgba(0,150,225,0.14), rgba(0,150,225,0));
      pointer-events: none;
    }

    .hero {
      position: relative;
      z-index: 1;
      margin-bottom: 10px;
    }

    .avatar-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }

    .avatar {
      width: 168px;
      max-width: 70%;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 10px 20px rgba(10, 48, 92, 0.14));
    }

    .avatar img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      font-size: 31px;
      line-height: 1.05;
      color: var(--text-dark);
      letter-spacing: -0.5px;
    }

    .subtitle {
      max-width: 300px;
      margin: 8px auto 14px;
      font-size: 14px;
      line-height: 1.45;
      color: var(--text-soft);
    }

    .status-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(0, 150, 225, 0.10);
      color: var(--text-dark);
      font-weight: bold;
      font-size: 14px;
      box-shadow: inset 0 0 0 1px rgba(0, 150, 225, 0.08);
    }

    .live-indicator {
      display: none;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(35, 178, 109, 0.12);
      color: var(--success);
      font-weight: bold;
      font-size: 14px;
      box-shadow: inset 0 0 0 1px rgba(35, 178, 109, 0.12);
    }

    .conversation-panel {
      position: relative;
      z-index: 1;
      margin-top: 4px;
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(246,250,255,0.95));
      border-radius: 24px;
      padding: 12px;
      box-shadow: inset 0 0 0 1px rgba(17, 76, 128, 0.06);
    }

    .bubble-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.2px;
      color: var(--text-soft);
    }

    .bubble-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--blue-main);
      box-shadow: 0 0 0 4px rgba(0, 150, 225, 0.10);
      flex-shrink: 0;
    }

    .transcript {
      margin-top: 0;
      padding: 16px 16px 18px;
      border-radius: 20px;
      background: var(--bubble-bg);
      min-height: 108px;
      text-align: left;
      font-size: 15px;
      line-height: 1.55;
      color: var(--text-dark);
      white-space: pre-wrap;
      box-shadow: inset 0 0 0 1px rgba(17, 76, 128, 0.05);
    }

    .controls {
      margin-top: 14px;
      position: relative;
      z-index: 1;
    }

    .btn {
      width: 100%;
      padding: 16px 18px;
      background: linear-gradient(180deg, #16a4ea, var(--blue-main));
      color: white;
      border: none;
      border-radius: 18px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 12px 26px rgba(0, 150, 225, 0.28);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(0, 150, 225, 0.30);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
      box-shadow: 0 8px 18px rgba(0, 150, 225, 0.18);
    }

    .end-btn {
      margin-top: 10px;
      background: linear-gradient(180deg, #ffffff, #f4f8fd);
      color: var(--blue-deep);
      box-shadow: inset 0 0 0 1px rgba(11, 58, 100, 0.16), 0 8px 18px rgba(7, 36, 74, 0.08);
    }

    .end-btn:hover {
      box-shadow: inset 0 0 0 1px rgba(11, 58, 100, 0.20), 0 10px 20px rgba(7, 36, 74, 0.10);
    }

    .hidden {
      display: none !important;
    }

    .helper-text {
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .footer {
      margin-top: 14px;
      font-size: 11px;
      color: #7f90a4;
      line-height: 1.3;
    }

    .footer img {
      width: 90px;
      margin-top: 6px;
      opacity: 0.9;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .card {
        padding: 18px 16px 14px;
        border-radius: 26px;
      }

      .avatar {
        width: 154px;
      }

      h1 {
        font-size: 28px;
      }

      .subtitle {
        font-size: 13px;
      }

      .transcript {
        font-size: 14px;
        min-height: 102px;
      }

      .btn {
        font-size: 15px;
      }

      .footer img {
        width: 84px;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="hero">
      <div class="avatar-wrap">
        <div class="avatar">
          <img src="morgan-avatar-headset.png" alt="Morgan Avatar">
        </div>
      </div>

      <h1>Morgan Speaking</h1>

      <div class="subtitle">
        Speak naturally and improve your English in real time
      </div>

      <div class="status-row">
        <div id="status" class="status">Status: idle</div>
        <div id="liveIndicator" class="live-indicator">Morgan is listening... 🎤</div>
      </div>
    </div>

    <div class="conversation-panel">
      <div class="bubble-label">
        <span class="bubble-dot"></span>
        <span>Morgan</span>
      </div>

      <div id="transcript" class="transcript">
        Tap Start Speaking and say hello to Morgan.
      </div>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn">Start Speaking</button>
      <button id="endSessionBtn" class="btn end-btn">End Session</button>

      <div class="helper-text" id="helperText">
        Loading your practice time...
      </div>
    </div>

    <div class="footer">
      by Private English<br>
      <img src="private-english-logo.png" alt="Private English Logo">
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCRkbUlnab-JCpCBBEaNx115TJlaTFsFFA",
      authDomain: "morgan-private-english.firebaseapp.com",
      projectId: "morgan-private-english",
      storageBucket: "morgan-private-english.firebasestorage.app",
      messagingSenderId: "332315256815",
      appId: "1:332315256815:web:00fc1cd1710b0e0037381a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let pc = null;
    let dc = null;
    let localStream = null;
    let remoteAudioEl = null;
    let transcript = "";
    let isStarting = false;
    let isConnected = false;

    let practiceTimer = null;
    let sessionSecondsUsed = 0;
    let sessionSecondsReported = 0;
    let firebaseReady = false;
    let userUsageDocRef = null;

    const FREE_TRIAL_SECONDS = 180;
    const FIREBASE_COLLECTION = "users_usage";
    const CHECKPOINT_INTERVAL_SECONDS = 15;

    const urlParams = new URLSearchParams(window.location.search);
    const accessMode = urlParams.get("access");
    const planType = (urlParams.get("plan") || "").toLowerCase();
    const userEmail = (urlParams.get("email") || "").trim().toLowerCase();

    const isPaidAccess = accessMode === "paid";
    const validPaidPlans = ["basic", "plus", "annual"];
    const hasValidPaidPlan = isPaidAccess && validPaidPlans.includes(planType);
    const rawRemaining = parseInt(urlParams.get("remaining") || "0", 10);
    // IMPORTANT:
    // Adalo may send remaining_seconds through Magic Text, but Netlify is the source of truth
    // for official plan limits. Do not let the URL value define the paid plan limit.
    let paidSecondsRemaining = 0;

    const startBtn = document.getElementById("startBtn");
    const endSessionBtn = document.getElementById("endSessionBtn");
    const statusEl = document.getElementById("status");
    const transcriptEl = document.getElementById("transcript");
    const liveIndicator = document.getElementById("liveIndicator");
    const helperText = document.getElementById("helperText");

    function setStatus(text) {
      statusEl.innerText = text;
    }

    function updateTranscript(text) {
      transcriptEl.innerText = text;
    }

    function hideStartButton() {
      startBtn.disabled = true;
      startBtn.classList.add("hidden");
      liveIndicator.style.display = "block";
    }

    function showStartButton() {
      startBtn.disabled = false;
      startBtn.classList.remove("hidden");
      liveIndicator.style.display = "none";
    }

    function formatTime(seconds) {
      const safeSeconds = Math.max(0, Number(seconds) || 0);
      const mins = Math.floor(safeSeconds / 60);
      const secs = safeSeconds % 60;
      return `${mins}:${secs.toString().padStart(2, "0")}`;
    }

    function getPlanLabel() {
      if (planType === "basic") return "Basic";
      if (planType === "plus") return "Plus";
      if (planType === "annual") return "Annual";
      return "Paid";
    }

    function getDefaultLimitForPlan(plan) {
      if (plan === "basic") return 900;      // 15 minutes
      if (plan === "plus") return 2400;      // 40 minutes
      if (plan === "annual") return 999999;  // unlimited placeholder
      return 0;
    }

    function getActivationLimitForPlan(plan) {
      // Official monthly limits by plan.
      // Basic = 15 minutes = 900 seconds.
      // Plus = 40 minutes = 2400 seconds.
      // Annual = unlimited.
      return getDefaultLimitForPlan(plan);
    }

    function isAnnualPlan() {
      return hasValidPaidPlan && planType === "annual";
    }

    function makeSafeDocId(email) {
      return email
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]/g, "_")
        .replace(/_+/g, "_")
        .replace(/^_+|_+$/g, "");
    }

    function clearPracticeTimer() {
      if (practiceTimer) {
        clearInterval(practiceTimer);
        practiceTimer = null;
      }
    }

    async function loadOrCreateUsageRecord() {
      if (!isPaidAccess) {
        firebaseReady = true;
        initializeAccessDisplay();
        return;
      }

      if (!hasValidPaidPlan) {
        firebaseReady = true;
        setStatus("Invalid plan");
        updateTranscript("We could not validate your Morgan plan. Please return to Morgan and try again.");
        helperText.innerText = "Invalid or missing plan.";
        startBtn.disabled = true;
        return;
      }

      if (!userEmail) {
        firebaseReady = true;
        setStatus("Missing email");
        updateTranscript("We could not identify your account. Please return to Morgan and try again.");
        helperText.innerText = "Missing user email.";
        startBtn.disabled = true;
        return;
      }

      const docId = makeSafeDocId(userEmail);
      userUsageDocRef = db.collection(FIREBASE_COLLECTION).doc(docId);

      try {
        const snap = await userUsageDocRef.get();
        const defaultLimit = getDefaultLimitForPlan(planType);
        const activationLimit = getActivationLimitForPlan(planType);

        if (!snap.exists) {
          const initialRemaining = activationLimit;

          await userUsageDocRef.set({
            email: userEmail,
            plan: planType,
            monthly_seconds_limit: activationLimit,
            paid_seconds_used: 0,
            remaining_seconds: initialRemaining,
            last_session_seconds: 0,
            subscription_activated_at: firebase.firestore.FieldValue.serverTimestamp(),
            created_at: firebase.firestore.FieldValue.serverTimestamp(),
            updated_at: firebase.firestore.FieldValue.serverTimestamp()
          });

          paidSecondsRemaining = initialRemaining;
        } else {
          const data = snap.data() || {};
          const storedPlan = (data.plan || "").toLowerCase();
          const firestoreRemaining = Number(data.remaining_seconds);
          const firestoreLimit = Number(data.monthly_seconds_limit);
          const alreadyActivated = !!data.subscription_activated_at;

          // CASE 1:
          // No plan saved yet, or the saved plan is different from the current paid plan.
          // This happens when a user buys Basic/Plus/Annual after using free minutes.
          if (!storedPlan || storedPlan !== planType) {
            await userUsageDocRef.set({
              email: userEmail,
              plan: planType,
              monthly_seconds_limit: activationLimit,
              paid_seconds_used: 0,
              remaining_seconds: activationLimit,
              last_session_seconds: 0,
              subscription_activated_at: firebase.firestore.FieldValue.serverTimestamp(),
              updated_at: firebase.firestore.FieldValue.serverTimestamp(),
              plan_changed_at: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            paidSecondsRemaining = activationLimit;

          // CASE 2:
          // Old Firestore record has 0 seconds, but this is the first time we are activating
          // the paid subscription in Netlify. Reset once, then do not reset again every visit.
          } else if (Number.isFinite(firestoreRemaining) && firestoreRemaining <= 0 && !alreadyActivated) {
            await userUsageDocRef.set({
              email: userEmail,
              plan: planType,
              monthly_seconds_limit: activationLimit,
              paid_seconds_used: 0,
              remaining_seconds: activationLimit,
              last_session_seconds: 0,
              subscription_activated_at: firebase.firestore.FieldValue.serverTimestamp(),
              updated_at: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            paidSecondsRemaining = activationLimit;

          // CASE 3:
          // Safety correction: if a previous deploy saved more time than the official plan limit,
          // cap it back to the correct monthly limit. This fixes Basic showing 60:00 instead of 15:00.
          } else if (!isAnnualPlan() && Number.isFinite(firestoreRemaining) && firestoreRemaining > defaultLimit) {
            await userUsageDocRef.set({
              email: userEmail,
              plan: planType,
              monthly_seconds_limit: defaultLimit,
              paid_seconds_used: 0,
              remaining_seconds: defaultLimit,
              corrected_plan_limit_at: firebase.firestore.FieldValue.serverTimestamp(),
              subscription_activated_at: alreadyActivated ? data.subscription_activated_at : firebase.firestore.FieldValue.serverTimestamp(),
              updated_at: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            paidSecondsRemaining = defaultLimit;

          // CASE 4:
          // Normal returning paid user. Use Firestore remaining time, capped by the official plan limit.
          } else if (Number.isFinite(firestoreRemaining)) {
            paidSecondsRemaining = isAnnualPlan()
              ? Math.max(0, firestoreRemaining)
              : Math.min(defaultLimit, Math.max(0, firestoreRemaining));

          } else if (Number.isFinite(firestoreLimit)) {
            paidSecondsRemaining = Math.max(0, firestoreLimit);

            await userUsageDocRef.set({
              email: userEmail,
              plan: planType,
              monthly_seconds_limit: Math.max(firestoreLimit, activationLimit),
              remaining_seconds: paidSecondsRemaining,
              subscription_activated_at: alreadyActivated ? data.subscription_activated_at : firebase.firestore.FieldValue.serverTimestamp(),
              updated_at: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

          } else {
            paidSecondsRemaining = activationLimit;

            await userUsageDocRef.set({
              email: userEmail,
              plan: planType,
              monthly_seconds_limit: activationLimit,
              remaining_seconds: activationLimit,
              subscription_activated_at: alreadyActivated ? data.subscription_activated_at : firebase.firestore.FieldValue.serverTimestamp(),
              updated_at: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
          }
        }

        firebaseReady = true;
        initializeAccessDisplay();

      } catch (err) {
        console.error("Firebase load/create error:", err);
        firebaseReady = false;
        setStatus("Firebase error");
        updateTranscript("We could not load your remaining practice time. Please try again.");
        helperText.innerText = "Could not load usage data.";
        startBtn.disabled = true;
      }
    }

    function initializeAccessDisplay() {
      if (!isPaidAccess) {
        helperText.innerText = "Your free practice session will last 3 minutes.";
        return;
      }

      if (isAnnualPlan()) {
        helperText.innerText = "Annual plan: unlimited speaking practice.";
        return;
      }

      if (paidSecondsRemaining <= 0) {
        startBtn.disabled = true;
        setStatus("No time remaining");
        updateTranscript("You have used all your speaking time for this month. Please return to Morgan to manage your plan.");
        helperText.innerText = "No speaking time remaining this month.";
        return;
      }

      helperText.innerText = `${getPlanLabel()} plan time remaining: ${formatTime(paidSecondsRemaining)}`;
    }

    async function reportUsage(reason) {
      if (!hasValidPaidPlan || isAnnualPlan()) return;
      if (!userUsageDocRef) return;

      const deltaToReport = sessionSecondsUsed - sessionSecondsReported;

      if (deltaToReport <= 0) return;

      try {
        let newRemainingFromFirestore = paidSecondsRemaining;

        await db.runTransaction(async (transaction) => {
          const snap = await transaction.get(userUsageDocRef);

          if (!snap.exists) {
            const defaultLimit = getDefaultLimitForPlan(planType);
            const newRemaining = Math.max(0, defaultLimit - deltaToReport);

            transaction.set(userUsageDocRef, {
              email: userEmail,
              plan: planType,
              monthly_seconds_limit: defaultLimit,
              paid_seconds_used: deltaToReport,
              remaining_seconds: newRemaining,
              last_session_seconds: deltaToReport,
              last_reason: reason || "unknown",
              created_at: firebase.firestore.FieldValue.serverTimestamp(),
              updated_at: firebase.firestore.FieldValue.serverTimestamp()
            });

            newRemainingFromFirestore = newRemaining;
            return;
          }

          const data = snap.data() || {};
          const currentRemaining = Math.max(0, Number(data.remaining_seconds) || 0);
          const currentUsed = Math.max(0, Number(data.paid_seconds_used) || 0);

          const newRemaining = Math.max(0, currentRemaining - deltaToReport);
          const newUsed = currentUsed + deltaToReport;

          transaction.set(userUsageDocRef, {
            email: userEmail,
            plan: planType,
            paid_seconds_used: newUsed,
            remaining_seconds: newRemaining,
            last_session_seconds: deltaToReport,
            last_reason: reason || "unknown",
            updated_at: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });

          newRemainingFromFirestore = newRemaining;
        });

        sessionSecondsReported = sessionSecondsUsed;
        paidSecondsRemaining = Math.max(0, newRemainingFromFirestore);

      } catch (err) {
        console.error("Firebase usage report failed:", err);
      }
    }

    function startPracticeTimer() {
      clearPracticeTimer();
      sessionSecondsUsed = 0;
      sessionSecondsReported = 0;

      if (!isPaidAccess) {
        let freeSecondsRemaining = FREE_TRIAL_SECONDS;
        helperText.innerText = `Free practice time remaining: ${formatTime(freeSecondsRemaining)}`;

        practiceTimer = setInterval(async () => {
          freeSecondsRemaining -= 1;

          if (freeSecondsRemaining > 0) {
            helperText.innerText = `Free practice time remaining: ${formatTime(freeSecondsRemaining)}`;
            return;
          }

          clearPracticeTimer();
          await endMorganTrialSession();
        }, 1000);

        return;
      }

      if (isAnnualPlan()) {
        helperText.innerText = "Annual plan: unlimited speaking practice.";
        return;
      }

      if (paidSecondsRemaining <= 0) {
        clearPracticeTimer();
        endMorganPaidTimeSession();
        return;
      }

      helperText.innerText = `${getPlanLabel()} plan time remaining: ${formatTime(paidSecondsRemaining)}`;

      practiceTimer = setInterval(async () => {
        paidSecondsRemaining -= 1;
        sessionSecondsUsed += 1;

        if (sessionSecondsUsed > 0 && sessionSecondsUsed % CHECKPOINT_INTERVAL_SECONDS === 0) {
          await reportUsage("checkpoint");
        }

        if (paidSecondsRemaining > 0) {
          helperText.innerText = `${getPlanLabel()} plan time remaining: ${formatTime(paidSecondsRemaining)}`;
          return;
        }

        clearPracticeTimer();
        await endMorganPaidTimeSession();
      }, 1000);
    }

    async function cleanupSession() {
      clearPracticeTimer();

      try {
        if (dc) {
          dc.onopen = null;
          dc.onmessage = null;
          try { dc.close(); } catch (_) {}
          dc = null;
        }

        if (pc) {
          pc.ontrack = null;
          pc.onconnectionstatechange = null;
          try { pc.close(); } catch (_) {}
          pc = null;
        }

        if (localStream) {
          localStream.getTracks().forEach(track => {
            try { track.stop(); } catch (_) {}
          });
          localStream = null;
        }

        if (remoteAudioEl) {
          try {
            remoteAudioEl.pause();
            remoteAudioEl.srcObject = null;
            remoteAudioEl.remove();
          } catch (_) {}
          remoteAudioEl = null;
        }
      } catch (_) {}
    }

    function returnToAdalo() {
      try {
        window.history.go(-1);
      } catch (_) {}

      setTimeout(() => {
        try {
          window.history.back();
        } catch (_) {}
      }, 300);

      setTimeout(() => {
        try {
          window.close();
        } catch (_) {}
      }, 600);
    }

    async function endMorganSession() {
      try {
        setStatus("Ending session...");
        await reportUsage("manual_end");
        await cleanupSession();
      } catch (_) {}

      isStarting = false;
      isConnected = false;

      liveIndicator.style.display = "none";
      showStartButton();

      setStatus("Session ended");
      updateTranscript("Your session has ended. Tap your phone’s Back button to return to Morgan.");
      helperText.innerText = "Your practice session is closed. Use your phone’s Back button to return to the Morgan app.";

      returnToAdalo();
    }

    async function endMorganTrialSession() {
      try {
        setStatus("Free practice ended");
        await cleanupSession();
      } catch (_) {}

      isStarting = false;
      isConnected = false;

      liveIndicator.style.display = "none";
      showStartButton();

      setStatus("Free practice ended");
      updateTranscript("Tu tiempo de práctica gratuita ha finalizado. Elige un plan para seguir practicando inglés con Morgan.");
      helperText.innerText = "Returning to Morgan...";

      setTimeout(() => {
        returnToAdalo();
      }, 1200);
    }

    async function endMorganPaidTimeSession() {
      try {
        setStatus("Time limit reached");
        await reportUsage("time_limit_reached");
        await cleanupSession();
      } catch (_) {}

      isStarting = false;
      isConnected = false;

      liveIndicator.style.display = "none";
      showStartButton();

      setStatus("Time limit reached");
      updateTranscript("Your speaking time for this month has ended. Return to Morgan to manage your plan.");
      helperText.innerText = "Returning to Morgan...";

      setTimeout(() => {
        returnToAdalo();
      }, 1200);
    }

    async function startMorgan() {
      if (isStarting || isConnected) return;

      if (hasValidPaidPlan && !firebaseReady) {
        setStatus("Loading time...");
        updateTranscript("Please wait while we load your remaining practice time.");
        return;
      }

      if (hasValidPaidPlan && !isAnnualPlan() && paidSecondsRemaining <= 0) {
        setStatus("No time remaining");
        updateTranscript("You have used all your speaking time for this month. Please return to Morgan to manage your plan.");
        helperText.innerText = "No speaking time remaining this month.";
        startBtn.disabled = true;
        return;
      }

      isStarting = true;
      hideStartButton();
      setStatus("Connecting...");
      updateTranscript("Morgan is getting ready...");

      if (!isPaidAccess) {
        helperText.innerText = "Your free practice session will last 3 minutes.";
      } else if (isAnnualPlan()) {
        helperText.innerText = "Annual plan: unlimited speaking practice.";
      } else {
        helperText.innerText = `${getPlanLabel()} plan time remaining: ${formatTime(paidSecondsRemaining)}`;
      }

      try {
        await cleanupSession();
        transcript = "";
        sessionSecondsUsed = 0;
        sessionSecondsReported = 0;

        const tokenRes = await fetch("/.netlify/functions/session");
        const tokenData = await tokenRes.json();

        if (!tokenRes.ok || !tokenData.value) {
          throw new Error(JSON.stringify(tokenData));
        }

        const EPHEMERAL_KEY = tokenData.value;

        pc = new RTCPeerConnection();

        remoteAudioEl = document.createElement("audio");
        remoteAudioEl.autoplay = true;
        remoteAudioEl.playsInline = true;
        document.body.appendChild(remoteAudioEl);

        pc.ontrack = (e) => {
          if (remoteAudioEl.srcObject !== e.streams[0]) {
            remoteAudioEl.srcObject = e.streams[0];
          }
        };

        pc.onconnectionstatechange = async () => {
          if (!pc) return;

          if (
            pc.connectionState === "failed" ||
            pc.connectionState === "disconnected" ||
            pc.connectionState === "closed"
          ) {
            await reportUsage("connection_closed");
            await cleanupSession();
            isStarting = false;
            isConnected = false;
            setStatus("Disconnected");
            updateTranscript("Connection closed.");
            showStartButton();
          }
        };

        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

        dc = pc.createDataChannel("oai-events");

        dc.onopen = () => {
          setStatus("Connected 🎤");
          isStarting = false;
          isConnected = true;
          updateTranscript("Morgan is listening...");
          startPracticeTimer();
        };

        dc.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            console.log("Realtime event:", msg);

            if (msg.type === "response.output_audio_transcript.delta" && msg.delta) {
              transcript += msg.delta;
              updateTranscript(transcript);
            }

            if (msg.type === "response.output_audio_transcript.done" && msg.transcript) {
              transcript = msg.transcript;
              updateTranscript(transcript);
            }

            if (msg.type === "error") {
              console.error("Realtime error event:", msg);
              setStatus("Error ❌");
              updateTranscript(msg.error?.message || "OpenAI error");
            }
          } catch (err) {
            console.error("Data channel parse error:", err);
          }
        };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        const sdpResponse = await fetch("https://api.openai.com/v1/realtime/calls", {
          method: "POST",
          body: offer.sdp,
          headers: {
            Authorization: `Bearer ${EPHEMERAL_KEY}`,
            "Content-Type": "application/sdp"
          }
        });

        const answerSdp = await sdpResponse.text();

        if (!sdpResponse.ok) {
          throw new Error(answerSdp);
        }

        await pc.setRemoteDescription({
          type: "answer",
          sdp: answerSdp
        });

      } catch (err) {
        console.error(err);
        await cleanupSession();
        updateTranscript("Something went wrong");
        setStatus("Error ❌");
        isStarting = false;
        isConnected = false;
        showStartButton();
      }
    }

    window.addEventListener("beforeunload", () => {
      if (!hasValidPaidPlan || isAnnualPlan()) return;
      if (sessionSecondsUsed <= sessionSecondsReported) return;

      reportUsage("beforeunload");
    });

    startBtn.addEventListener("click", startMorgan);
    endSessionBtn.addEventListener("click", endMorganSession);

    loadOrCreateUsageRecord();
  </script>
</body>
</html>
